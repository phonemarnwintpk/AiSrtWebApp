<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video/Audio to Myanmar SRT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased p-4 sm:p-8">

    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">🎬 AI Video to Myanmar SRT</h1>
            <p class="text-gray-500">Upload your media, set your API key, and generate subtitles seamlessly.</p>
        </header>

        <main class="bg-white shadow-xl rounded-2xl p-6 sm:p-8 border border-gray-100 space-y-6">
            
            <div>
                <label for="apiKey" class="block text-sm font-semibold text-gray-700 mb-2">🔑 Google Gemini API Key</label>
                <input type="password" id="apiKey" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Enter your API key here...">
            </div>

            <div>
                <label for="langSelect" class="block text-sm font-semibold text-gray-700 mb-2">🌐 Output Language</label>
                <select id="langSelect" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white transition">
                    <option value="my">Translated Myanmar SRT (မြန်မာစာတန်းထိုး)</option>
                    <option value="en">Original SRT (မူရင်းစာတန်းထိုး)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">📂 Upload Media File</label>
                <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:bg-gray-50 transition-colors duration-200">
                    <div class="text-4xl mb-3">☁️</div>
                    <p class="text-gray-700 font-medium">Click to upload or drag & drop</p>
                    <p class="text-xs text-gray-400 mt-1">Supported formats: MP4, MKV, MP3, WAV, M4A</p>
                    <input type="file" id="fileInput" class="hidden" accept=".mp4,.mkv,.mp3,.wav,.m4a">
                </div>
                <p id="fileStatus" class="text-sm font-medium text-green-600 mt-3 hidden"></p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">📝 Generated SRT Preview</label>
                <div id="srtPreview" class="bg-gray-900 text-green-400 p-5 rounded-xl h-48 overflow-y-auto font-mono text-sm shadow-inner whitespace-pre-wrap">Waiting for file upload...</div>
            </div>

            <div class="pt-2 flex justify-end">
                <button id="downloadBtn" disabled class="bg-gray-300 text-gray-500 px-6 py-3 rounded-xl font-semibold cursor-not-allowed transition-all duration-200 flex items-center gap-2">
                    ⬇️ Download .srt File
                </button>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
