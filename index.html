<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Master AI - Pro Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased relative min-h-screen flex flex-col">

    <div class="bg-gray-200/80 p-1.5 rounded-2xl flex items-center gap-1 shadow-inner">
    <button id="tabStudio" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-white shadow-sm text-gray-900 flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-blue-500"></i> Studio
    </button>
    <button id="tabHistory" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all text-gray-500 hover:text-gray-700 flex items-center gap-2">
        <i class="fa-solid fa-clock-rotate-left text-orange-500"></i> History
    </button>
</div>


    <main class="flex-1 p-4 md:p-8 overflow-y-auto relative w-full">
        <div id="studio-view" class="view-panel active">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">AI Subtitle Studio</h1>
                <p class="text-gray-500 text-sm mt-1">Generate perfect SRTs powered by Gemini</p>
            </div>
            
            
        </div>

        <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="space-y-6">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-gray-800"><i class="fa-solid fa-key text-orange-500 mr-2"></i>Gemini API Key</h3>
                        <span id="keyStatusBadge" class="px-2 py-1 bg-red-100 text-red-600 text-[10px] rounded-full font-bold">Not Saved</span>
                    </div>
                    <input type="password" id="apiKey" class="w-full bg-gray-50 border border-gray-200 px-4 py-3 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm outline-none transition" placeholder="Paste key (Saved locally)">
                    <button id="saveKeyBtn" class="mt-3 w-full bg-gray-800 text-white text-sm font-semibold py-2.5 rounded-xl hover:bg-gray-900 transition">Save Key to Browser</button>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                    <select id="langSelect" class="w-full bg-gray-50 border border-gray-200 px-4 py-3 rounded-xl text-sm font-bold text-gray-700 mb-4 outline-none">
                        <option value="my">🇲🇲 Translated Myanmar SRT</option>
                        <option value="en">🇺🇸 Original English SRT</option>
                    </select>

                    <h3 class="font-bold text-gray-800 mb-2"><i class="fa-solid fa-link text-pink-500 mr-2"></i>Video Link</h3>
                    <div class="flex gap-2 mb-4">
                        <input type="url" id="videoLink" class="flex-1 bg-gray-50 border border-gray-200 px-4 py-3 rounded-xl text-sm outline-none" placeholder="YouTube/TikTok URL">
                        <button id="processLinkBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 rounded-xl transition shadow-md">Go</button>
                    </div>

                    <div class="relative flex items-center justify-center w-full">
                        <hr class="w-full border-gray-200"><span class="absolute bg-white px-3 text-xs text-gray-400 font-bold">OR</span>
                    </div>

                    <div id="dropZone" class="mt-4 border-2 border-dashed border-blue-200 rounded-2xl p-6 text-center cursor-pointer hover:bg-blue-50 transition bg-blue-50/30">
                        <input type="file" id="fileInput" class="hidden" accept="video/*,audio/*">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-400 mb-2"></i>
                        <p class="text-sm font-bold text-blue-700">Upload Media File</p>
                        <p class="text-xs text-gray-500 mt-1">MP4, MP3, WAV</p>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900 rounded-3xl p-6 shadow-xl border border-gray-800 flex flex-col h-[500px]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-white"><i class="fa-solid fa-terminal text-green-400 mr-2"></i>Live Preview</h3>
                    <span id="fileStatus" class="text-xs text-blue-400 font-semibold bg-blue-900/30 px-2 py-1 rounded-md hidden">Processing...</span>
                </div>
                <div class="flex-1 bg-gray-950 rounded-2xl p-4 overflow-y-auto font-mono text-sm">
                    <pre id="srtPreview" class="text-green-400 whitespace-pre-wrap leading-relaxed">Waiting for magic... ✨</pre>
                </div>
                <button id="downloadBtn" class="mt-4 w-full bg-gray-700 text-gray-400 font-bold py-3.5 rounded-xl cursor-not-allowed transition flex items-center justify-center gap-2" disabled>
                    <i class="fa-solid fa-download"></i> Download .srt File
                </button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
